<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tesla VIN Investigator</title><link rel="stylesheet" href="/static/style.css"><script src="/static/investigator.js" defer></script></head><body><header><div class="header-inner"><a class="brand" href="/">⚡ Tesla Deal Hunter</a><strong>VIN Investigator</strong></div></header><main><h1>Evidence before a test drive</h1><p>Compare listings with your inspection. A search with no adverse results does not establish clean history.</p><section class="settings-card"><h2>Automatic VIN research</h2><p id="queue-status" role="status">Loading queue…</p><section id="queue-results"></section></section><form id="lookup"><label>VIN <input id="vin" maxlength="17" required placeholder="17-character VIN"></label><button class="action-btn">Investigate</button></form><p id="message" role="status"></p><section id="report"></section><section class="settings-card"><h2>Add an observation</h2><form id="evidence"><label>Attribute<select id="field"><option>trim</option><option>drivetrain</option><option>year</option><option>mileage</option><option>price</option><option>location</option><option>hw4</option><option>fsd</option><option>history</option><option>availability</option></select></label><label>What did you observe?<input id="value" required maxlength="2000"></label><label>Evidence type<select id="kind"><option value="user_report">Reported observation</option><option value="physical_inspection">My physical inspection</option><option value="seller">Seller claim</option><option value="aggregator">Aggregator claim</option><option value="history_report">History report</option></select></label><label>Source / document / inspection details<input id="source" required maxlength="500"></label><label>Supporting URL (optional)<input id="url" type="url"></label><button class="action-btn">Save evidence</button></form></section></main></body></html>
